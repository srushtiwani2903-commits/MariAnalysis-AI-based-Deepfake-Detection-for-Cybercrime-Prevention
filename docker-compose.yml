version: "3.9"

services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_AI_DEPS: ${INSTALL_AI_DEPS:-0}
    container_name: marianalysis-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      # Persistent DB + security/audit logs live on a volume.
      DATABASE_URL: sqlite:////data/deepfake.db
      UPLOAD_FOLDER: /app/uploads
      REPORT_FOLDER: /app/reports
    volumes:
      - marianalysis_data:/data
      - marianalysis_security:/app/security
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: node:20-alpine
    container_name: marianalysis-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run build && npx serve -s build -l 3000"
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5001/api}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  marianalysis_data:
  marianalysis_security:
  frontend_node_modules:
